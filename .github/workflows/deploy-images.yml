name: Deploy public/ to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  pages: write
  id-token: write

# Pages は常に最新のコミットだけが意味を持つため、後続の実行が先行分を蹴って進む。
# false にしていた頃、waiting のまま固まった実行が約1ヶ月グループを掴み、
# 後続が連日 cancelled になって公開サイトが 2026-08-05 から更新されなかった。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
